name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.21.0-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: shards-${{ hashFiles('shard.lock') }}

      - name: Install dependencies
        run: shards install --frozen

      - name: Check formatting
        run: crystal tool format --check src spec

      # `ameba` is a target of ameba's own shard, not of ours, so it is built
      # from its entrypoint rather than with `shards build ameba`.
      - name: Lint
        run: |
          mkdir -p bin
          crystal build lib/ameba/src/cli.cr -o bin/ameba
          ./bin/ameba src spec --no-color

      - name: Test
        run: crystal spec

      - name: Build
        run: shards build --error-on-warnings

      # The example profiles exercise every step kind against the real schema,
      # so a regression in any parser shows up here even if a spec missed it.
      - name: Validate the example profiles
        run: |
          for profile in examples/*.yaml; do
            echo "validating $profile"
            ./bin/fluxion validate -c "$profile" --no-color
          done

      - name: Preview the example profiles
        run: |
          for profile in examples/*.yaml; do
            ./bin/fluxion dry-run -c "$profile" --no-color > /dev/null
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the installer
        run: shellcheck --shell=sh site/install.sh

      - name: Check the maintenance scripts
        run: shellcheck scripts/*.sh

  # SonarQube Cloud. Deliberately its own job on a plain runner rather than a
  # step in `test`: the scanner needs a JVM and node, which the Crystal Alpine
  # container does not carry.
  #
  # It runs on the same triggers as everything else here — a bare
  # `pull_request:` already defaults to opened/synchronize/reopened, which is
  # exactly what the scanner wants.
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    # `secrets` are not exposed to workflows triggered from a fork, so without
    # this the job would fail with an empty token on every outside contribution
    # and show a red cross that says nothing about the change.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Shallow clones cost the analysis its blame data, which is what
          # new-code detection and issue attribution are built on.
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
