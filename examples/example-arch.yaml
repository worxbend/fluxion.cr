apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: arch-workstation
  labels:
    distro: arch
spec:
  target:
    os:
      distribution: arch
  phases:
    - name: system-foundation
      description: "Install base Arch packages from official repositories"
      restartPolicy:
        type: none
      execution:
        continueOnError: true
      steps:
        - name: core-cli-tools
          kind: pacman-packages
          execution:
            continueOnError: true
          spec:
            packages:
              - git
              - curl
              - wget
              - htop
              - ripgrep
              - fd
              - bat
              - zsh
              - tmux
              - neovim
              - just
              - zellij
              - fzf
              - jq
              - tree

        - name: dev-tools
          kind: pacman-packages
          execution:
            continueOnError: true
          spec:
            packages:
              - gcc
              - clang
              - cmake
              - make
              - jdk21-openjdk
              - nodejs
              - go
              - python
              - python-pip
              - rust

    - name: aur-packages
      description: "Install user-facing packages from AUR"
      dependsOn:
        - system-foundation
      restartPolicy:
        type: none
      execution:
        continueOnError: true
      steps:
        - name: aur-extras
          kind: aur-packages
          execution:
            continueOnError: true
          spec:
            packageManager: paru
            packages:
              - jetbrains-toolbox
              - google-chrome
              - visual-studio-code-bin

    - name: desktop-apps
      description: "Install desktop applications from Flathub"
      dependsOn:
        - system-foundation
      restartPolicy:
        type: none
      execution:
        continueOnError: true
      steps:
        - name: flathub-remote
          kind: flatpak-remote
          spec:
            remote: flathub
            url: https://flathub.org/repo/flathub.flatpakrepo
            checksum:
              algorithm: sha256
              value: 3371dd250e61d9e1633630073fefda153cd4426f72f4afa0c3373ae2e8fea03a

        - name: desktop-flatpaks
          kind: flatpak-packages
          spec:
            remote: flathub
            appIds:
              - com.spotify.Client
              - org.telegram.desktop
              - com.obsproject.Studio

    - name: shell
      description: "Switch to zsh and install Oh My Zsh"
      dependsOn:
        - system-foundation
      restartPolicy:
        type: prompt-logout
        message: "Default shell changed to zsh. Log out and back in, then re-run fluxion."
      execution:
        continueOnError: false
      steps:
        - name: zsh-default
          kind: default-shell
          spec:
            shellPath: /bin/zsh
            probeCommand: "getent passwd $USER | cut -d: -f7 | grep -q zsh"

        - name: oh-my-zsh
          kind: oh-my-zsh
          spec:
            installDir: "~/.oh-my-zsh"
            revision: c5ba74cf02cce4c342153f79089100194f30940f
            sha256: 95118b50d062198597e2b73d3a57b609fd95ca68cdc86faf4460d955f0172b61
            probeCommand: "test -d ~/.oh-my-zsh"
