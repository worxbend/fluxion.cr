# nerd-fonts-installer configuration for system-bootstrap-fedora.
#
# Fluxion points at this file and runs the installer; the installer owns
# this schema. Previously these fields lived inline in the profile and
# Fluxion rendered them into exactly this shape at run time.

release: v3.4.0
destination: ~/.fonts
refresh_font_cache: true
families:
  - JetBrainsMono
  - MPlus
  - Terminus
  - FantasqueSansMono
  - Noto
  - Hack
  - HeavyData
  - 3270
  - FiraCode
  - LiberationMono
  - RobotoMono
  - Mononoki
  - Ubuntu
  - DroidSansMono
  - Monoid
  - SpaceMono
  - SourceCodePro
  - ComicShannsMono
  - SymbolsOnly
  - DaddyTimeMono
  - UbuntuMono
  - Meslo
  - FiraMono
  - CodeNewRoman
  - CascadiaCode
  - Hasklig
  - DejaVuSansMono
  - ZedMono
  - Inconsolata
  - Hermit
  - CommitMono
  - Agave
  - GeistMono
  - Monaspace
  - ShareTechMono
  - Recursive
  - D2Coding
  - EnvyCodeR
  - IosevkaTerm
  - Lekton
  - Lilex
  - VictorMono
