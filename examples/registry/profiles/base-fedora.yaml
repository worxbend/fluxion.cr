apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: base-fedora
spec:
  target:
    os:
      distribution: fedora
  phases:
    - name: core
      steps:
        - name: core-tools
          kind: dnf-packages
          spec:
            packages: [git, curl, jq, ripgrep, fd-find]
