name: fluxion
version: 0.3.1
description: |
  Turn a fresh Linux machine into your machine. One YAML file, one preview,
  one run. CLI or TUI. A Crystal implementation of the Fluxion workstation
  bootstrapper.

authors:
  - worxbend

targets:
  fluxion:
    main: src/main.cr

crystal: ">= 1.21.0"

license: MIT

dependencies:
  kiwi:
    github: da1nerd/kiwi.cr
    version: ~> 0.3.0

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    # 1.6.4 is the newest release and it does not build on Crystal 1.21 (it
    # calls Crystal::Lexer#next_string_array_token, which 1.21 removed). Move
    # back to a version constraint once a release carrying
    # crystal-ameba/ameba#866 exists.
    commit: b50c1ffde626449c8fd32c1ae68813b2be2bb101
