sonar.projectKey=worxbend_fluxion.cr
sonar.organization=worxbend

sonar.sourceEncoding=UTF-8

# What SonarQube Cloud can actually see here
# ------------------------------------------
# There is no Crystal analyzer, so the ~29k lines under src/ and spec/ are
# indexed but not rule-checked. What this analysis genuinely covers is the
# site's HTML, the YAML (GitHub Actions, Kubernetes and Docker rules), and the
# secret-detection pass, which runs across every file regardless of language.
#
# Crystal's own checks stay where they are and remain the real gate: `crystal
# tool format --check`, `ameba`, and the spec suite, all in the `test` job of
# .github/workflows/ci.yml. Do not read a clean Sonar quality gate as a
# statement about the Crystal.

# Listed explicitly rather than `sonar.sources=.` so that `sonar.tests` does
# not overlap them — a path indexed as both source and test is an analysis
# error, not a warning.
sonar.sources=src,site,scripts,examples,.github
sonar.tests=spec

# lib/ and bin/ are build output and already gitignored; api-docs/ is generated
# by `crystal docs`. src/crytui is a vendored, ported toolkit — see
# src/crytui/VENDORED.md — and is excluded from ameba for the same reason:
# findings against code we did not write and do not style are noise.
sonar.exclusions=lib/**,bin/**,api-docs/**,src/crytui/**

# The example profiles and their companion binstaller/nerd-fonts configs are
# fixtures: they carry deliberately invalid hosts and placeholder digests to
# exercise the parser, so secret- and URL-shaped findings in them are expected.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=examples/**
